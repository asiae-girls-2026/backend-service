# AWS 오버라이드 — EC2 에서 base 와 같이 씀 (정화 10/4 구성: ALB → EC2:80 → api, TLS 는 ALB/ACM)
#   .env 에 DATABASE_URL=postgresql://<user>:<pw>@<rds-endpoint>:5432/carepong  (저장소에 올리지 않음)
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.aws.yml up -d --build
services:
  api:
    volumes: !reset []   # EC2 에선 이미지 안의 코드 사용
    ports:
      - "80:8000"        # ALB 타겟 = EC2:80, 헬스체크 /health
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]   # --reload 제거, 워커 1
    depends_on:
      model:
        condition: service_started
    restart: unless-stopped
  model:
    ports: !reset []     # 외부 미노출
    restart: unless-stopped
  db:
    deploy:
      replicas: 0        # RDS 사용 — 로컬 db 상자 안 켬
