# 케어퐁 서버 — 상자 4개를 한 번에 켜는 설정
# 실행 (저장소 루트에서): docker compose -f infra/docker-compose.yml up --build
# 끄기: docker compose down        (DB 데이터 유지)
#       docker compose down -v     (DB 데이터까지 삭제)

services:

  # ① 문지기: 바깥 요청을 받아서 api/model로 넘김. AWS에선 HTTPS 담당
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [api, model]

  # ② 메인 API (FastAPI) — 약·루틴·펫·완화·설정
  api:
    build: ../api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]   # 로컬 자동 리로드. AWS에선 이 줄 삭제
    environment:
      DATABASE_URL: postgresql+psycopg://carepong:carepong@db:5432/carepong
      DATA_GO_KR_KEY: ${DATA_GO_KR_KEY:-}
      MODEL_URL: http://model:8001
    ports:
      - "8000:8000"      # 로컬 테스트용. 앱은 http://localhost:8000 호출
    depends_on: [db]

  # ③ 모델 API (FastAPI) — 지금은 목 응답. DA 모델 받으면 여기만 채움
  model:
    build: ../model
    ports:
      - "8001:8001"      # 로컬 디버그용. AWS에선 이 줄 삭제 (api 만 내부 호출)

  # ④ DB — 로컬 테스트용. AWS에선 이 상자 대신 RDS 주소를 DATABASE_URL에 넣음
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: carepong
      POSTGRES_PASSWORD: carepong
      POSTGRES_DB: carepong
    ports:
      - "5432:5432"      # 로컬용. AWS에선 RDS 사용 — 이 상자 자체를 뺀다
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  caddy_data:
