name: test

# push/PR 마다 api·model 단위 테스트. DB 없이 돌 수 있는 것만 (test_db.py 는 DATABASE_URL 없으면 skip).
# collector 는 pynput 때문에 Windows 전용 → CI 제외. 배포는 하지 않는다 (EC2 수동, scripts/deploy_api_paste.txt).
on:
  push:
    branches: [main]
    paths: ["api/**", "model/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["api/**", "model/**", ".github/workflows/test.yml"]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt pytest
      - run: pytest -q
        working-directory: api

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "fastapi==0.115.*" "uvicorn[standard]==0.30.*" httpx pytest
      - run: pytest -q
        working-directory: model
